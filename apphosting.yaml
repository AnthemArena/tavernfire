# Firebase App Hosting settings for Tavernfire.
# NEXT_PUBLIC_ values are baked into the site when it is built, so they are
# marked BUILD. None of these are secrets (Firebase web config is public by
# design), so they are safe to keep in Git.
#
# Values below come from your Firebase web app config.

runConfig:
  # Keep costs low while the site is new: scale to zero when nobody is visiting.
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: tavernfire-3fcb5
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAPGjKw61NK4hlviDU_cz2kxJiKiBUU384
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: tavernfire-3fcb5.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: tavernfire-3fcb5.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 585639437973
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:585639437973:web:b93b6579e6e502dbc81d9c
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ENABLE_ANSWERS
    value: "true"
    availability: [BUILD, RUNTIME]
